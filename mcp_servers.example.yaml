# mcp_servers.example.yaml — copiar a mcp_servers.yaml (gitignored).
# Trust boundary: SOLO el operador escribe este archivo.
# Credenciales SOLO por env vars, nunca en este yaml.

reporter:
  - name: artifacts-fs
    transport: stdio
    command: python
    args: ["scripts/mcp_fs_server.py", "/tmp/pentest-reports"]

# --- fase 2 ---
recon:
  - name: osint-passive
    transport: stdio
    command: python
    args: ["scripts/mcp_osint_server.py"]
    env:
      PENTEST_OSINT_CONFIRM_DOMAIN: "midominio.co"   # lab/demo (dominio propio)
      # en engagement real: engagement.yaml -> osint.allowed_domains

exploit: []   # opt-in: activar SOLO con gates abiertos en el proceso worker
