[project]
name = "pentest-agent"
version = "0.1.0"
description = "PoC: supervisor + subagentes LangGraph para auditoria de seguridad (recon -> CVE correlation -> reporte)"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.6",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "httpx>=0.27",
    "PyYAML>=6",
    "a2a-sdk[sqlite]==0.2.11",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pentest-audit = "pentest_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pentest_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
